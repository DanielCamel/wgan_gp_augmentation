[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "wgan-gp-augmentation"
version = "0.1.0"
description = "Reproducible pilot study of class-specific WGAN-GP augmentation for CICIDS2017"
requires-python = ">=3.11,<3.15"
dependencies = [
  "joblib>=1.4",
  "numpy>=2.0",
  "pandas>=2.2",
  "scikit-learn>=1.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]
gan = ["torch>=2.5"]
report = ["matplotlib>=3.9", "seaborn>=0.13"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

