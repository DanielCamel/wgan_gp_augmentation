[experiment]
name = "cicids2017_smoke"
seed = 42
selected_labels = ["BENIGN", "DDoS", "DoS Hulk", "PortScan", "Bot", "Web Attack - XSS", "DoS Slowhttptest"]
minority_labels = ["Bot", "Web Attack - XSS", "DoS Slowhttptest"]

[data]
label_column = "Label"
chunk_size = 50000
max_rows_per_class = 300
test_fraction = 0.15
validation_fraction = 0.15
variance_threshold = 1e-12
pca_variance = 0.95

[classifier]
hidden_layers = [32, 16]
batch_size = 128
learning_rate = 0.001
max_epochs = 4
patience = 2
alpha = 0.0001

[wgan]
hidden_layers = [32, 32]
batch_size = 64
latent_dim = 16
train_steps = 10
critic_steps = 2
learning_rate = 0.0001
beta1 = 0.0
beta2 = 0.9
gradient_penalty = 10.0
target_train_count = 250
log_interval = 1
