[experiment]
name = "cicids2017_pilot"
seed = 42
selected_labels = [
  "BENIGN",
  "DDoS",
  "DoS Hulk",
  "PortScan",
  "Bot",
  "Web Attack - XSS",
  "DoS Slowhttptest",
]
minority_labels = ["Bot", "Web Attack - XSS", "DoS Slowhttptest"]

[data]
label_column = "Label"
chunk_size = 100000
max_rows_per_class = 20000
test_fraction = 0.15
validation_fraction = 0.15
variance_threshold = 1e-12
pca_variance = 0.95

[classifier]
hidden_layers = [128, 64]
batch_size = 512
learning_rate = 0.001
max_epochs = 50
patience = 7
alpha = 0.0001

[wgan]
hidden_layers = [128, 128, 64]
batch_size = 128
latent_dim = 32
train_steps = 400
critic_steps = 5
learning_rate = 0.0001
beta1 = 0.0
beta2 = 0.9
gradient_penalty = 10.0
target_train_count = 5000
log_interval = 25
